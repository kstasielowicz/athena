{% extends 'base.html' %}{% block title %}Routines{% endblock %}{% block content %}<div class="grid cols-3"><div class="card"><h3>Create routine</h3><form method="post"><label>Name</label><input name="name" required placeholder="ATHENA Push Strength"><label>Goal</label><input name="goal" placeholder="Strength / hypertrophy"><label>Intensity</label><select name="intensity"><option>Low</option><option selected>Medium</option><option>Medium-High</option><option>High</option></select><label>Notes</label><textarea name="notes"></textarea><br><br><button class="primary">Create</button></form></div><div class="card" style="grid-column:span 2"><h3>Saved templates</h3><table><tr><th>Routine</th><th>Goal</th><th>Intensity</th><th>Exercises</th><th></th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.goal}}</td><td><span class="pill">{{r.intensity}}</span></td><td>{{r.exercise_count}}</td><td><a href="/routines/{{r.id}}">Edit</a> · <a href="/routines/{{r.id}}/start">Start</a></td></tr>{% endfor %}</table></div></div>{% endblock %}
